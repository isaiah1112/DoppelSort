[project]
name = "doppelsort"
version = "0.1.0"
description = "A python CLI for matching an image to others to find a \"doppelgänger\""
readme = "README.md"
authors = [
    { name = "Jesse Almanrode", email = "jesse@almanrode.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1.7",
    "deepface[tensorflow]>=0.0.93",
    "pillow>=10.4.0",
    "tensorflow==2.21.0",
    "tensorflow-metal==1.2.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "tf-keras>=2.16.0",
]

[project.scripts]
doppelsort = "doppelsort.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = "--cov=doppelsort --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["doppelsort"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[build-system]
requires = ["uv_build>=0.12.16,<0.14.0"]
build-backend = "uv_build"
