[project]
name = "doppelsort"
version = "0.1.0"
description = "A python CLI for matching an image to others to find a \"doppelgänger\""
readme = "README.md"
authors = [
    { name = "Jesse Almanrode", email = "jesse@almanrode.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1.7",
    "deepface[tensorflow]>=0.0.93",
    "tf-keras>=2.16.0",
]

[project.scripts]
doppelsort = "doppelsort.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
